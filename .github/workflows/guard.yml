name: Guard

on: [push, pull_request]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -B -m unittest scripts/test_guard.py scripts/test_header.py scripts/test_figure.py
      - run: scripts/guard --all
